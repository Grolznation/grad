<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        :root { 
            --espresso: #1a0f0a; 
            --gold: #c5a059;   
            --cream: #f9f7f2; 
        }
        
        body, html { 
            margin:0; padding:0; background: var(--espresso); color: var(--cream); 
            font-family: 'Garamond', serif; height: 100vh; overflow: hidden; 
        }

        /* NAVIGATION HEADER */
        header {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: center;
            padding: 25px 0; background: rgba(26, 15, 10, 0.85); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
        header nav a { 
            color: var(--gold); text-decoration: none; margin: 0 20px; 
            font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; 
            cursor: pointer; transition: 0.4s;
        }
        header nav a:hover { color: var(--cream); }

        /* CONFETTI BURST */
        .confetti-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; overflow: hidden; z-index: 1; pointer-events: none; }
        .confetti { position: absolute; width: 8px; height: 8px; background: var(--gold); opacity: 0.8; top: -10%; animation: fall linear forwards; }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(60vh) rotate(720deg); opacity: 0; }
        }

        /* LOADER (1.5s) */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: var(--espresso); display: none; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999;
        }
        .dots { display: flex; gap: 15px; }
        .dot { width: 10px; height: 10px; background: var(--gold); border-radius: 50%; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }

        /* PAGES */
        .page { display: none; height: 100vh; width: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; position: relative; animation: fadeIn 0.8s ease; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* CEREMONY GRID */
        .details-container {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: 20px; max-width: 1000px; margin-top: 40px; z-index: 2;
        }
        .info-box {
            width: 280px; height: 180px; border: 1px solid rgba(197, 160, 89, 0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0.02); padding: 20px; box-sizing: border-box;
        }
        .info-box h3 { color: var(--gold); font-size: 0.85rem; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 15px; }
        .info-box p { margin: 5px 0; font-size: 1rem; color: var(--cream); opacity: 0.9; }

        /* SLIDESHOW FRAME (Back and Working!) */
        .slideshow-frame {
            position: relative; width: 260px; height: 360px; padding: 10px; border: 1px solid var(--gold);
            margin-bottom: 20px; background: var(--espresso); overflow: hidden; margin-top: 40px; z-index: 2;
        }
        .slide { 
            position: absolute; top: 10px; left: 10px; 
            width: calc(100% - 20px); height: calc(100% - 20px); 
            opacity: 0; transition: opacity 2s ease-in-out; 
            background-size: cover; background-position: center; 
        }
        .slide.visible { opacity: 1; }

        /* Updated Ceremony Box with Hover Effect */
        .info-box {
            width: 280px; 
            height: 180px; 
            border: 1px solid rgba(197, 160, 89, 0.4);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            background: rgba(255, 255, 255, 0.02); 
            padding: 20px; 
            box-sizing: border-box;
            transition: all 0.4s ease; /* Smooth transition for color and border */
            cursor: default;
        }

        .info-box:hover {
            background: rgba(197, 160, 89, 0.15); /* Changes to a bronze tint on hover */
            border-color: var(--gold); /* Border becomes full gold */
            transform: translateY(-5px); /* Optional: slight lift effect for extra class */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn { 
            background: none; border: 1px solid var(--gold); color: var(--gold); 
            padding: 14px 40px; cursor: pointer; letter-spacing: 4px; 
            text-transform: uppercase; font-size: 0.7rem; transition: 0.3s; margin-top: 30px; z-index: 2;
        }
        .btn:hover { background: var(--gold); color: var(--espresso); }

        h1 { font-size: clamp(2rem, 10vw, 3rem); color: var(--gold); letter-spacing: 8px; text-transform: uppercase; margin: 10px 0; font-weight: 400; }
    </style>
</head>
<body>

    <header>
        <nav>
            <a onclick="jumpTo('p1')">Home</a>
            <a onclick="jumpTo('p2')">Ceremony</a>
            <a onclick="jumpTo('p3')">RSVP</a>
        </nav>
    </header>

    <div id="loader">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <div id="p1" class="page active">
        <div class="confetti-container" id="confetti-bg"></div>
        <div class="slideshow-frame">
            <div class="slide visible" style="background-image: url('grad_pic.jpg');"></div>
            <div class="slide" style="background-image: url('grad_pic1.JPG');"></div>
            <div class="slide" style="background-image: url('grad_pic2.JPG');"></div>
        </div>
        <p style="letter-spacing: 4px; font-size: 0.7rem;">THE GRADUATION OF</p>
        <h1>STEPHENIE EZERIBE</h1>
        <button class="btn" onclick="jumpTo('p2')">View Details</button>
    </div>

    <div id="p2" class="page">
        <h1>THE EVENT</h1>
        <div class="details-container">
            <div class="info-box">
                <h3>THE CEREMONY</h3>
                <p>Wednesday, May 19th</p>
                <p>9:00 AM Sharp</p>
            </div>
            <div class="info-box">
                <h3>THE VENUE</h3>
                <p>NRG Arena</p>
                <p>1 NRG Park, Houston, TX, 77054</p>
            </div>
            <div class="info-box">
                <h3>DRESS CODE</h3>
                <p>Formal Attire</p>
                <!-- <p>Brown & Gold Accents</p> -->
            </div>
            <div class="info-box">
                <h3>RECEPTION</h3>
                <p>Dinner & Dancing</p>
                <p>To follow at 6:00 PM</p>
            </div>
        </div>
        <button class="btn" onclick="jumpTo('p3')">Continue to RSVP</button>
    </div>

    <div id="p3" class="page">
        <h1>RSVP</h1>
        <p style="margin-bottom: 20px;">Kindly respond by April 30th.</p>
        <button class="btn" onclick="window.open('https://forms.google.com')">Confirm Now</button>
    </div>

    <script>
        // NAVIGATION
        function jumpTo(nextId) {
            const currentActive = document.querySelector('.page.active');
            if (currentActive.id === nextId) return;
            const loader = document.getElementById('loader');
            loader.style.display = 'flex';
            currentActive.classList.remove('active');
            setTimeout(function() {
                loader.style.display = 'none';
                document.getElementById(nextId).classList.add('active');
                if(nextId === 'p1') startConfetti();
            }, 1500); 
        }

        // SLIDESHOW LOGIC (Fixed)
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        
        function showNextSlide() {
            if (slides.length === 0) return;
            slides[currentSlide].classList.remove('visible');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('visible');
        }
        setInterval(showNextSlide, 5000);

        // CONFETTI
        function startConfetti() {
            const container = document.getElementById('confetti-bg');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 60; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = Math.random() > 0.5 ? '#c5a059' : '#f9f7f2';
                confetti.style.animationDuration = '5s';
                confetti.style.animationDelay = (Math.random() * 2) + 's';
                container.appendChild(confetti);
            }
            setTimeout(() => { container.innerHTML = ''; }, 7000);
        }
        window.onload = startConfetti;
    </script>

</body>
</html>
